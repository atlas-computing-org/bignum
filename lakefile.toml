name = "bignum"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Bignum", "BignumTests"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
experimental.module = true

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "cslib"
scope = "leanprover"

[[lean_lib]]
name = "Bignum"
globs = ["Bignum", "Bignum.**"]

[[lean_lib]]
name = "BignumTests"
needs = ["Bignum"]

[[lean_exe]]
name = "sh"
root = "Shake"
